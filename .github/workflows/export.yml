name: Weekly SleekFlow Export

on:
  workflow_dispatch:

  schedule:
    - cron: '0 1 * * 1'

jobs:
  export:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: '3.11'

    - name: Install Packages
      run: |
        pip install pandas requests

    - name: Run Export

      env:
        SLEEKFLOW_API_KEY: ${{ secrets.SLEEKFLOW_API_KEY }}

      run: |
        python export.py

    - name: Upload Output

      uses: actions/upload-artifact@v4

      with:
        name: sleekflow-debug
        path: first_response.json
